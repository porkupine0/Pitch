<title>Pitch Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;600;700&display=swap" crossorigin>
<style>
:root{
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#e2e7ee; --ink:#18202b; --muted:#5a6676; --line:#d3dae4;
  --accent:#c2552d; --accent-ink:#ffffff; --s0:#c2552d; --s1:#2b4a73; --s2:#2a8a55; --s3:#b88a12; --red:#c0263a;
  --lead:#fbece6; --good:#1f7a4d; --good-bg:#e2f3e8; --bad:#b3261e; --bad-bg:#fdeceb; --gold:#9a6b00; --gold-bg:#fbf0d2;
  --shadow:0 1px 2px rgba(24,32,43,.06),0 6px 18px rgba(24,32,43,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e1219; --surface:#171c26; --surface-2:#212835; --ink:#edf1f7; --muted:#9eabbd; --line:#2d3646;
  --accent:#f0845a; --accent-ink:#0e1219; --s0:#f0845a; --s1:#7fa6db; --s2:#5fcf8f; --s3:#e9bf4a; --red:#ff7a8a;
  --lead:#35211a; --good:#5fd39a; --good-bg:#15301f; --bad:#f28b82; --bad-bg:#3b1e1c; --gold:#f2c14e; --gold-bg:#3a2f10;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1219; --surface:#171c26; --surface-2:#212835; --ink:#edf1f7; --muted:#9eabbd; --line:#2d3646;
  --accent:#f0845a; --accent-ink:#0e1219; --s0:#f0845a; --s1:#7fa6db; --s2:#5fcf8f; --s3:#e9bf4a; --red:#ff7a8a;
  --lead:#35211a; --good:#5fd39a; --good-bg:#15301f; --bad:#f28b82; --bad-bg:#3b1e1c; --gold:#f2c14e; --gold-bg:#3a2f10;
  --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700}
h3{font-size:16px;font-weight:800;color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:38px;height:38px;flex:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab{padding:9px 6px;border-radius:10px;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--s1);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.hint{font-size:14px;color:var(--muted);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:8px 12px;border-radius:999px;font-size:14px}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.names{display:flex;flex-direction:column;gap:8px}
.setrow{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.toggle .tl{font-weight:600}
.toggle .ts{display:block;font-size:13px;color:var(--muted);font-weight:400}
.switch{width:52px;height:30px;border-radius:999px;padding:0;position:relative;background:var(--surface-2);flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{left:25px}
.red{color:var(--red)}
.x0{--sc:var(--s0)} .x1{--sc:var(--s1)} .x2{--sc:var(--s2)} .x3{--sc:var(--s3)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:0;background:var(--sc)}

/* scoreboard */
.sides{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.side{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);border-top:5px solid var(--sc)}
.side.lead{background:var(--lead)}
.side .nm{font-weight:800;font-size:16px;overflow-wrap:anywhere;color:var(--sc)}
.side .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.side .sc{font-family:"Bricolage Grotesque",sans-serif;font-size:44px;font-weight:800;line-height:1}
.side .sc.hole{color:var(--bad)}
.side .gap{font-size:13px;font-weight:700;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--sc)}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--bad-bg);color:var(--bad);margin-left:4px}
.tag.go{background:var(--good-bg);color:var(--good)}

.strip{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--bg)}
.strip .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px}
.strip .meta{font-size:14px;opacity:.85}
.push{border:2px solid var(--accent);border-radius:14px;padding:12px 16px;background:var(--surface)}
.push .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px;text-wrap:balance}

/* entry */
.step{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-of-type{border-bottom:0}
.sh{display:flex;align-items:baseline;gap:8px}
.sh .t{font-weight:800}
.sh .v{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.sh .s{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:9px 14px;border-radius:999px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--sc,var(--accent));color:#fff;border-color:var(--sc,var(--accent))}
.chip.none[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);border-color:var(--ink)}
.suit{font-size:22px;padding:4px 16px;line-height:1.2}
.bids{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.bids button{height:50px;padding:0;font-size:20px;font-weight:800}
.bids button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.gamecount{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:10px;border-radius:10px;background:var(--bg)}

<body>

<div class="wrap" id="app"></div>

<script>
const KEY = "pitch-scorekeeper-v1";
const LOGO = `<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#c2552d"/>${[["H",14,14,"#9c3a1d"],["L",54,14,"#2b4a73"],["J",14,54,"#2b4a73"],["G",54,54,"#9c3a1d"]].map(([t,x,y,c])=>`<rect x="${x}" y="${y}" width="32" height="32" rx="7" fill="#fff"/><text x="${x+16}" y="${y+24}" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="21" fill="${c}">${t}</text>`).join("")}</svg>`;
const SUITS = [{k:"S",s:"♠",n:"Spades"},{k:"H",s:"♥",n:"Hearts",r:1},{k:"D",s:"♦",n:"Diamonds",r:1},{k:"C",s:"♣",n:"Clubs"}];
const suitHtml = k => { const x = SUITS.find(q=>q.k===k); return !x ? "" : x.r ? `<span class="red">${x.s}</span>` : x.s; };
// Point items, counted in this order when two teams could go out on the same hand
const ITEMS = [
  { k:"high", name:"High", sub:"Highest trump played", v:1 },
  { k:"low", name:"Low", sub:"Lowest trump", v:1 },
  { k:"jack", name:"Jack", sub:"Jack of trump", v:1, none:"Not dealt" },
  { k:"offjack", name:"Off-Jack", sub:"Jack of the same color", v:1, none:"Not dealt", extra:true },
  { k:"bigjoker", name:"Big Joker", v:1, none:"Not dealt", extra:true, grp:"jokers" },
  { k:"littlejoker", name:"Little Joker", v:1, none:"Not dealt", extra:true, grp:"jokers" },
  { k:"three", name:"Three", sub:"3 of trump", v:3, none:"Not dealt", extra:true },
  { k:"game", name:"Game", sub:"Most card points in tricks", v:1, none:"Tie" },
];

const blankSetup = () => ({ mode:"teams", names:["","","",""], teams:[{name:"",p:["",""]},{name:"",p:["",""]}], firstDealer:0, target:11,
  lowRule:"taken", stuck:true, bidderOut:true, smudge:false, offjack:false, jokers:false, three:false, drink:false });
let state = load() || { phase:"setup", setup:blankSetup(), sides:[], seats:[], rules:{}, hands:[], pending:null, match:{results:[]}, tab:"game" };
let entry = null;
let confirmKey = null, confirmTimer = null;

function load(){ try{ const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plural = (n, w) => `${n} ${w}${n===1?"":"s"}`;
const SN = i => esc(state.sides[i].name);
const PN = s => esc(state.seats[s].name);
const sideOf = seat => state.seats[seat].side;
const signed = n => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
const plainN = n => (n < 0 ? "−" : "") + Math.abs(n);
const isTeams = () => state.sides.length === 2 && state.seats.length === 4;
const verb = i => state.sides[i].sub || /s$/i.test(state.sides[i].name) ? "" : "s";

function activeItems(R){ R = R || state.rules; return ITEMS.filter(it => !it.extra || (it.k === "offjack" && R.offjack) || (it.grp === "jokers" && R.jokers) || (it.k === "three" && R.three)); }
const maxPoints = R => activeItems(R).reduce((a,it)=>a+it.v,0);

function buildSeats(su){
  if (su.mode === "teams"){
    const teams = su.teams.map((t,i)=>({ name: t.name.trim() || (i===0?"Us":"Them"), p: t.p.map((x,k)=> x.trim() || `Partner ${k+1}`) }));
    return { sides: teams.map(t=>({ name:t.name, sub:`${t.p[0]} & ${t.p[1]}` })),
      seats: [ {name:teams[0].p[0],side:0}, {name:teams[1].p[0],side:1}, {name:teams[0].p[1],side:0}, {name:teams[1].p[1],side:1} ] };
  }
  const n = su.mode === "cut3" ? 3 : 4, names = su.names.slice(0,n).map((x,i)=> x.trim() || `Player ${i+1}`);
  return { sides: names.map(x=>({name:x, sub:""})), seats: names.map((x,i)=>({name:x, side:i})) };
}
const dealerOf = h => (state.rules.dealer0 + h) % state.seats.length;

// Score one hand. Bidder must take at least their bid, or loses the bid. Everyone else keeps what they take.
function scoreHand(h){
  const n = state.sides.length, raw = Array(n).fill(0), bs = sideOf(h.bidder);
  activeItems().forEach(it => { const w = h.pts[it.k]; if (w != null && w >= 0) raw[w] += it.v; });
  const made = raw[bs] >= h.bid;
  const pts = raw.slice(); if (!made) pts[bs] = -h.bid;
  const smudge = state.rules.smudge && h.bid === maxPoints() && made && activeItems().every(it => h.pts[it.k] === bs || (it.none && h.pts[it.k] === -1 && it.k !== "game"));
  return { raw, pts, made, bs, smudge };
}
function runGame(){
  const n = state.sides.length, t = Array(n).fill(0); let win = null, how = "";
  for (let hi = 0; hi < state.hands.length; hi++){
    const h = state.hands[hi], s = scoreHand(h), before = t.slice();
    s.pts.forEach((v,i)=> t[i] += v);
    if (win != null) continue;
    if (s.smudge){ win = s.bs; how = "smudge"; continue; }
    const over = t.map((v,i)=>i).filter(i => t[i] >= state.rules.target);
    if (!over.length) continue;
    if (over.length === 1){ win = over[0]; how = "target"; continue; }
    if (state.rules.bidderOut && s.made && over.includes(s.bs)){ win = s.bs; how = "bidder"; continue; }
    // Count out in order: High, Low, Jack, extras, Game. Bidder's points only count if they made it.
    const run = before.slice();
    for (const it of activeItems()){
      const w = h.pts[it.k]; if (w == null || w < 0) continue;
      if (w === s.bs && !s.made) continue;
      run[w] += it.v;
      if (run[w] >= state.rules.target){ win = w; how = "countout"; break; }
    }
    if (win == null){ const hi2 = Math.max(...t); const top = over.filter(i=>t[i]===hi2); if (top.length === 1){ win = top[0]; how = "target"; } }
  }
  return { t, win, how };
}
function drinks(h){
  if (!state.rules.drink) return null;
  const s = scoreHand(h), out = [];
  if (!s.made) out.push(`${SN(s.bs)} got set: ${isTeams()?"each drinks":"drink"} ${h.bid}`);
  if (h.pts.game === -1) out.push("Game tied: everybody sips");
  if (s.smudge) out.push(`Smudge! Everyone but ${SN(s.bs)} finishes their drink`);
  const stolen = activeItems().filter(it => it.k === "jack" && h.pts.jack >= 0 && h.pts.jack !== s.bs);
  if (stolen.length) out.push(`${SN(s.bs)} lost the Jack: sip`);
  return out.length ? out : ["Clean hand, no drinks"];
}

function confirmThen(key, fn){
  if (confirmKey === key){ clearTimeout(confirmTimer); confirmKey = null; fn(); return; }
  confirmKey = key; render();
  clearTimeout(confirmTimer);
  confirmTimer = setTimeout(()=>{ confirmKey = null; render(); }, 3500);
}
let wakeLock = null;
async function keepAwake(){
  try{ if (state.phase === "play" && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){
    wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; });
  }}catch(e){ wakeLock = null; }
}
document.addEventListener("visibilitychange", keepAwake);

// ---------- views ----------
function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement && document.activeElement.id;
  const y = window.scrollY;
  const reset = state.phase === "play" && state.tab === "game" ? `<button class="small ghost" data-act="newgame" id="newgame">${confirmKey==="new"?"Tap to confirm":"New game"}</button>` : "";
  app.innerHTML = `<div class="brand"><div class="logo">${LOGO}<h1>Pitch</h1></div><div class="hx-hbtns">${hx.button()}${reset}</div></div>
    <div class="tabs" role="tablist"><button class="tab" role="tab" id="tab-game" data-act="tab" data-v="game" aria-selected="${state.tab==="game"}">Game</button><button class="tab" role="tab" id="tab-guide" data-act="tab" data-v="guide" aria-selected="${state.tab==="guide"}">How to play</button></div>` +
    (state.tab === "guide" ? guideView() : state.phase === "setup" ? setupView() : playView());
  if (focusId){ const el = document.getElementById(focusId); if (el) el.focus({preventScroll:true}); }
  window.scrollTo(0, y);
}

function sw(key, label, sub){ const su = state.setup; return `<div class="toggle"><span class="tl">${label}<span class="ts">${sub}</span></span><button class="switch" role="switch" id="sw-${key}" data-act="rule" data-k="${key}" aria-checked="${!!su[key]}" aria-label="${label}"></button></div>`; }
function setupView(){
  const su = state.setup, { seats } = buildSeats(su);
  if (su.firstDealer >= seats.length) su.firstDealer = 0;
  let people;
  if (su.mode === "teams"){
    people = [0,1].map(t=>`<div class="setrow"><label class="lbl x${t}" for="tname-${t}"><span class="dot"></span>Team ${t+1}</label>
      <input type="text" id="tname-${t}" data-tname="${t}" placeholder="${t===0?"Us":"Them"}" value="${esc(su.teams[t].name)}" maxlength="16" autocomplete="off">
      <div class="pair"><input type="text" id="p-${t}-0" data-p="${t}-0" placeholder="Partner 1" value="${esc(su.teams[t].p[0])}" maxlength="14" autocomplete="off" aria-label="Team ${t+1} partner 1">
      <input type="text" id="p-${t}-1" data-p="${t}-1" placeholder="Partner 2" value="${esc(su.teams[t].p[1])}" maxlength="14" autocomplete="off" aria-label="Team ${t+1} partner 2"></div></div>`).join("") + `<p class="hint">Partners sit across from each other.</p>`;
  } else {
    const n = su.mode === "cut3" ? 3 : 4;
    people = `<div class="names">${Array.from({length:n},(_,i)=>`<div class="row x${i}"><span class="dot"></span><input type="text" id="name-${i}" data-name="${i}" placeholder="Player ${i+1}" value="${esc(su.names[i])}" maxlength="14" autocomplete="off" aria-label="Player ${i+1}"></div>`).join("")}</div>`;
  }

  const mp = maxPoints(su);
  return `<div class="panel">
    <div class="opts">
      <button class="opt" id="mode-teams" data-act="mode" data-v="teams" aria-pressed="${su.mode==="teams"}">4 players, partners</button>
      <button class="opt" id="mode-cut3" data-act="mode" data-v="cut3" aria-pressed="${su.mode==="cut3"}">3, cutthroat</button>
      <button class="opt" id="mode-cut4" data-act="mode" data-v="cut4" aria-pressed="${su.mode==="cut4"}">4, cutthroat</button>

    <div class="setrow"><span class="lbl">Play to</span>
      <div class="opts">${[11,15,21].map(v=>`<button class="opt" id="tg-${v}" data-act="target" data-v="${v}" aria-pressed="${su.target===v}">${v}</button>`).join("")}</div></div>
  </div>
  <div class="panel">
    <div class="eyebrow">House rules</div>
    <div><span class="lbl">Low goes to…</span>
      <div class="opts" style="margin-top:8px"><button class="opt" id="low-taken" data-act="low" data-v="taken" aria-pressed="${su.lowRule==="taken"}">Whoever takes it in a trick</button><button class="opt" id="low-dealt" data-act="low" data-v="dealt" aria-pressed="${su.lowRule==="dealt"}">Whoever was dealt it</button></div></div>
    ${sw("stuck","Stick the dealer","If everyone passes, the dealer must bid 2.")}
    ${sw("bidderOut","Bidder goes out","If two teams pass the target on the same hand, the bidder wins if they made it.")}
    ${sw("smudge","Smudge",`Bid ${mp} and take every point to win the game on the spot.`)}
    <div class="setrow"><span class="lbl">Extra point cards <span class="hint">(10-point pitch style)</span></span>
      ${sw("offjack","Off-Jack, 1 point","The other Jack of trump's color.")}
      ${sw("jokers","Jokers, 1 point each","Add both jokers to the deck. They count as trump.")}
      ${sw("three","Three of trump, 3 points","Goes to whoever takes it.")}
      <p class="hint num">That's ${mp} points in play each hand, so bids go from 2 to ${mp}.</p></div>
    ${sw("drink","Drinking variant","Get set, drink your bid. Lose the Jack as bidder, sip. Game ties, everybody sips.")}
  </div>
  <button class="primary" data-act="begin" id="begin">Start game</button>
  <p class="hint">New to Pitch? The How to play tab covers everything, with a worked example.</p>`;
}

function playView(){
  const { t, win, how } = runGame(), n = state.hands.length, T = state.rules.target, has = n > 0;
  const hi = Math.max(...t);
  let top = "";
  if (win != null){
    const howTxt = how === "smudge" ? "Smudge! Every point, game over." : how === "bidder" ? "Bidder goes out." : how === "countout" ? "Counted out first." : "";
    top = `<div class="banner"><div class="eyebrow" style="color:inherit;opacity:.85">Game over · ${plural(n,"hand")}</div>
      <h2>${SN(win)} win${verb(win)}, ${state.sides.map((s,i)=>plainN(t[i])).join(" to ")}</h2>${howTxt?`<div style="font-weight:700">${howTxt}</div>`:""}
      ${matchLine(win)}
      ${hx.saved()}
      <div class="btnrow"><button data-act="rematch" id="rematch">Next game</button><button data-act="newsetup" id="newsetup">New setup</button></div></div>`;
  } else if (state.match.results.length){
    top = `<div class="panel" style="padding:12px 16px">${matchLine()}</div>`;
  }
  const order = state.sides.map((_,i)=>i);
  const sides = order.map(i => {
    const lead = has && t[i] === hi && t.filter(v=>v===hi).length === 1;
    let gap = "";
    if (has){ const others = t.filter((v,j)=>j!==i); gap = lead ? `Leads by ${t[i] - Math.max(...others)}` : t[i] === hi ? "Tied for the lead" : `${hi - t[i]} behind`; }
    const need = T - t[i];
    return `<div class="side x${i} ${lead?"lead":""}"><span class="nm">${SN(i)}${t[i]<0?`<span class="tag">in the hole</span>`:""}${win==null&&need>0&&need<=maxPoints()?`<span class="tag go">can go out</span>`:""}</span>
      ${state.sides[i].sub?`<span class="sub">${esc(state.sides[i].sub)}</span>`:""}
      <span class="sc num ${t[i]<0?"hole":""}">${plainN(t[i])}</span>
      <div class="bar" aria-hidden="true"><span style="width:${Math.max(0,Math.min(100,t[i]/T*100))}%"></span></div>
      <span class="gap num">${gap}${gap&&win==null?" · ":""}${win==null?`needs ${Math.max(0,need)}`:""}</span></div>`;
  }).join("");

  let handBlock = "";
  const hIdx = entry && entry.editing != null ? entry.editing : n;
  if (win == null || entry){
    const d = dealerOf(hIdx), ns = state.seats.length;
    handBlock = `<div class="strip"><span class="eyebrow" style="color:inherit;opacity:.7">Hand ${hIdx+1}</span>
      <span class="big">${PN(d)} deals 6 cards each${state.rules.jokers?" (jokers in)":""}</span>
      <span class="meta">${PN((d+1)%ns)} bids first. ${PN(d)} bids last${state.rules.stuck?" and is stuck with 2 if everyone passes":""}.</span></div>`;
    if (entry) handBlock += entryView(hIdx);
    else if (state.pending) handBlock += pendingView();
    else handBlock += `<button class="primary" data-act="newHand" id="newHand">Who won the bid?</button>`;
  }
  return top + `<div class="sides">${sides}</div>` + handBlock + historyView() + statsView() + refCard() +
    `<p class="hint">Every game is saved in History on this device, and the screen stays on while you play.</p>`;
}

function matchLine(pendingWin){
  const wins = state.sides.map(()=>0);
  state.match.results.forEach(w => wins[w]++); if (pendingWin != null) wins[pendingWin]++;
  if (!wins.some(v=>v)) return "";
  return `<div class="match num"><span>Games won:</span>${state.sides.map((s,i)=>`<span class="x${i}"><span class="dot"></span>${SN(i)} ${wins[i]}</span>`).join("")}</div>`;
}

function refCard(){
  return `<details class="panel"><summary style="cursor:pointer;font-weight:800">Quick reference</summary>
    <dl class="ref" style="margin-top:8px">
      ${activeItems().map(it=>`<dt>${it.name}${it.sub?` · ${it.sub}`:""}</dt><dd>${it.v}</dd>`).join("")}
      <dt>Card points for “Game”</dt><dd>10=10 · A=4 · K=3 · Q=2 · J=1</dd>
      <dt>Trump order, high to low</dt><dd>A K Q J${state.rules.offjack?" Off-J":""} 10 … 2${state.rules.jokers?" (jokers below the Jack)":""}</dd>
      <dt>Low goes to</dt><dd>${state.rules.lowRule==="dealt"?"who was dealt it":"who takes it"}</dd>
    </dl></details>`;
}

function bidOptions(){ const mp = maxPoints(); return Array.from({length:mp-1},(_,k)=>k+2); }
function entryView(hIdx){
  const e = entry, ns = state.seats.length, d = dealerOf(hIdx);
  const bidOrder = Array.from({length:ns},(_,k)=>(d+1+k)%ns);
  const showBid = e.mode !== "points", showPts = e.mode !== "bid";
  let html = "";
  if (showBid){
    html += `<div class="step"><div class="sh"><span class="t">Who won the bid?</span></div>
      <div class="chips">${bidOrder.map(p=>`<button class="chip x${sideOf(p)}" id="bidder-${p}" data-act="bidder" data-i="${p}" aria-pressed="${e.bidder===p}">${PN(p)}${p===d?" (dealer)":""}</button>`).join("")}</div></div>
      <div class="step"><div class="sh"><span class="t">Bid</span>${state.rules.stuck?`<span class="s">Dealer stuck? That's a 2.</span>`:""}</div>
      <div class="bids">${bidOptions().map(v=>`<button id="bid-${v}" data-act="bid" data-v="${v}" aria-pressed="${e.bid===v}">${v}${state.rules.smudge&&v===maxPoints()?"<span style='font-size:11px;display:block;font-weight:700'>smudge</span>":""}</button>`).join("")}</div></div>
      <div class="step"><div class="sh"><span class="t">Trump</span><span class="s">the first card the bidder leads, optional</span></div>
      <div class="chips">${SUITS.map(x=>`<button class="chip suit" id="suit-${x.k}" data-act="suit" data-v="${x.k}" aria-pressed="${e.suit===x.k}" aria-label="${x.n}">${suitHtml(x.k)}</button>`).join("")}</div></div>`;
  }
  if (showPts){
    const sidesChips = (it) => state.sides.map((s,i)=>`<button class="chip x${i}" id="pt-${it.k}-${i}" data-act="pt" data-k="${it.k}" data-v="${i}" aria-pressed="${e.pts[it.k]===i}">${SN(i)}</button>`).join("") +
      (it.none ? `<button class="chip none" id="pt-${it.k}-none" data-act="pt" data-k="${it.k}" data-v="-1" aria-pressed="${e.pts[it.k]===-1}">${it.none}</button>` : "");
    html += activeItems().map(it => {
      const sub = it.k === "low" ? (state.rules.lowRule === "dealt" ? "Lowest trump, goes to who was dealt it" : "Lowest trump, goes to who takes it") : it.sub;
      let extra = "";
      if (it.k === "game") extra = `<div class="gamecount num">${state.sides.map((s,i)=>`<label class="x${i}"><span><span class="dot"></span>${SN(i)} counted</span><input type="text" inputmode="numeric" id="gc-${i}" data-gc="${i}" value="${esc(e.gc[i]??"")}" placeholder="0" autocomplete="off"></label>`).join("")}<span class="hint" style="grid-column:1/-1">Optional: type each ${isTeams()?"team's":"player's"} card points and the app picks Game. 10=10, A=4, K=3, Q=2, J=1.</span></div>`;
      return `<div class="step"><div class="sh"><span class="t">${it.name}</span>${sub?`<span class="s">${sub}</span>`:""}<span class="v">${plural(it.v,"pt")}</span></div><div class="chips">${sidesChips(it)}</div>${extra}</div>`;
    }).join("");
    const done = activeItems().every(it => e.pts[it.k] != null);
    if (done && e.bidder != null){
      const s = scoreHand(e);
      html += `<div class="outcome ${s.made?"":"set"}"><span class="big">${s.smudge?"Smudge!":s.made?`${SN(s.bs)} made it`:`${SN(s.bs)} got set`}</span>
        ${state.sides.map((x,i)=>`<span class="ln num"><span class="dot x${i}"></span>${SN(i)} ${signed(s.pts[i])}${i===s.bs?` (took ${s.raw[i]} on a bid of ${e.bid})`:""}</span>`).join("")}</div>`;
      const dr = drinks(e); if (dr) html += `<div class="sips">🍺 ${dr.join(" · ")}</div>`;
    }
  }
  const title = e.mode === "bid" ? `Hand ${hIdx+1}: the bid` : e.mode === "points" ? `Hand ${hIdx+1}: who took what` : `Edit hand ${hIdx+1}`;
  const btn = e.mode === "bid" ? "Lock in the bid" : e.mode === "points" ? `Post hand ${hIdx+1}` : "Save changes";
  return `<div class="panel"><div class="row"><h2 class="grow">${title}</h2><button class="small ghost" data-act="cancel" id="cancel">Cancel</button></div>
    ${e.mode==="points"?`<p class="hint">Tap who took each point.</p>`:""}
    <div>${html}</div>
    ${e.error?`<div class="err">${esc(e.error)}</div>`:""}
    <button class="primary" data-act="saveEntry" id="saveEntry">${btn}</button>
    ${e.mode==="edit"?`<button class="danger" data-act="delHand" id="delHand">${confirmKey==="del"?"Tap again to delete this hand":"Delete this hand"}</button>`:""}</div>`;
}

function pendingView(){
  const pd = state.pending, bs = sideOf(pd.bidder);
  return `<div class="panel"><div class="row"><h2 class="grow">${PN(pd.bidder)} bid ${pd.bid}${pd.suit?` in ${suitHtml(pd.suit)}`:""}</h2></div>
    <p class="hint">${SN(bs)} need${verb(bs)} at least ${plural(pd.bid,"point")}, or lose ${pd.bid}. ${PN(pd.bidder)} leads first, and that card's suit is trump.${state.rules.smudge&&pd.bid===maxPoints()?" Smudge attempt: take every point to win the game.":""}</p>
    <button class="primary" data-act="enterPoints" id="enterPoints">Hand's over: who took what?</button>
    <button class="small" data-act="changeBid" id="changeBid">Change the bid</button></div>`;
}

function historyView(){
  if (!state.hands.length) return "";
  const run = state.sides.map(()=>0);
  const rows = state.hands.map((h,hi) => {
    const s = scoreHand(h); s.pts.forEach((v,i)=> run[i] += v);
    const who = activeItems().map(it => { const w = h.pts[it.k]; return w == null ? "" : w < 0 ? "" : `${it.name} <b>${SN(w)}</b>`; }).filter(Boolean).join(" · ");
    const dr = drinks(h);
    return `<div class="hand"><div class="hh"><button class="small" id="edit-${hi}" data-act="edit" data-i="${hi}">Hand ${hi+1}</button>
      <span><b class="x${s.bs}" style="color:var(--sc)">${PN(h.bidder)}</b> bid ${h.bid}${h.suit?` ${suitHtml(h.suit)}`:""}</span>
      <span class="badge ${s.smudge?"smudge":s.made?"made":"set"}">${s.smudge?"Smudge":s.made?"Made":"Set"}</span></div>
      <span class="hl2 num">${state.sides.map((x,i)=>`${SN(i)} ${signed(s.pts[i])}`).join(" · ")} → ${run.map(plainN).join("–")}</span>
      <span class="hl2">${who}${h.pts.game===-1?" · Game tied":""}</span>
      ${dr && dr[0] !== "Clean hand, no drinks" ? `<span class="hl2">🍺 ${dr.join(" · ")}</span>` : ""}</div>`;
  }).reverse().join("");
  return `<div class="panel"><div class="row"><h2 class="grow">Hands</h2><button class="small" data-act="undo" id="undo">${confirmKey==="undo"?"Tap to confirm":"Undo last"}</button></div>${rows}<p class="hint">Newest first. Tap a hand to fix it.</p></div>`;
}

function statsView(){
  const H = state.hands, n = H.length; if (!n) return "";
  const ns = state.sides.length, np = state.seats.length, z = k => Array(k).fill(0);
  const bids = z(ns), made = z(ns), set = z(ns), setOthers = z(ns), bidSum = z(ns), smudges = z(ns);
  const took = {}; activeItems().forEach(it => took[it.k] = z(ns));
  const pBids = z(np), pMade = z(np), pBig = z(np); const suitCount = {};
  let bigBid = {v:0, list:[]};
  H.forEach(h => {
    const s = scoreHand(h);
    bids[s.bs]++; bidSum[s.bs] += h.bid; pBids[h.bidder]++;
    if (s.made){ made[s.bs]++; pMade[h.bidder]++; } else { set[s.bs]++; state.sides.forEach((_,i)=>{ if (i !== s.bs) setOthers[i]++; }); }
    if (s.smudge) smudges[s.bs]++;
    if (h.bid > bigBid.v && s.made) bigBid = {v:h.bid, list:[h.bidder]}; else if (h.bid === bigBid.v && s.made) bigBid.list.push(h.bidder);
    activeItems().forEach(it => { const w = h.pts[it.k]; if (w != null && w >= 0) took[it.k][w]++; });
    if (h.suit) suitCount[h.suit] = (suitCount[h.suit]||0) + 1;
  });
  const top = arr => { const m = Math.max(...arr); return { m, who: arr.map((v,i)=>i).filter(i=>arr[i]===m) }; };
  const nmS = idx => [...new Set(idx)].map(SN).join(", "), nmP = idx => [...new Set(idx)].map(PN).join(", ");
  const aw = (a,b,c) => `<div class="aw"><span class="an">${a}</span><span class="ah">${b}</span><span class="ad">${c}</span></div>`;
  const pct = (a,b) => b ? Math.round(100*a/b)+"%" : "–";
  const pb = top(pBids), jh = top(took.jack), so = top(setOthers), gm = top(took.game);
  const rate = made.map((m,i)=> bids[i] ? m/bids[i] : -1), rt = top(rate);
  const favSuit = Object.entries(suitCount).sort((a,b)=>b[1]-a[1])[0];
  const cards = [
    aw("Pitcher", nmP(pb.who), `Won the bid ${plural(pb.m,"time")}`),
    aw("Sure thing", rt.m>=0?nmS(rt.who):"Nobody yet", rt.m>=0?`Made ${pct(made[rt.who[0]], bids[rt.who[0]])} of their bids`:""),
    aw("Jack hunter", jh.m?nmS(jh.who):"Nobody yet", jh.m?`Took the Jack ${plural(jh.m,"time")}`:"No Jacks taken yet"),
    aw("Setters", so.m?nmS(so.who):"Nobody yet", so.m?`Set the bidder ${plural(so.m,"time")}`:"Every bid made so far"),
    aw("Game winners", gm.m?nmS(gm.who):"Nobody yet", gm.m?`Took Game ${plural(gm.m,"time")}`:""),
    aw(bigBid.v?"High roller":"Favorite trump", bigBid.v?nmP(bigBid.list):favSuit?suitHtml(favSuit[0]):"–", bigBid.v?`Made a bid of ${bigBid.v}`:favSuit?`Trump ${plural(favSuit[1],"time")}`:"Tap the trump suit to track it"),
  ];
  const head = ["", ...state.sides.map((s,i)=>SN(i))];
  const row = (l, arr) => `<tr><td>${l}</td>${arr.map(v=>`<td>${v}</td>`).join("")}</tr>`;
  const table = `<div class="tablewrap"><table class="st"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>
    ${row("Bids won", bids)}${row("Made", made)}${row("Set", set)}${row("Make rate", made.map((m,i)=>pct(m,bids[i])))}${row("Avg bid", bidSum.map((b,i)=>bids[i]?(b/bids[i]).toFixed(1):"–"))}
    ${activeItems().map(it=>row(`Took ${it.name}`, took[it.k])).join("")}${state.rules.smudge?row("Smudges", smudges):""}</tbody></table></div>`;
  const ptable = isTeams() ? `<div class="tablewrap"><table class="st"><thead><tr><th>Player</th><th>Bids won</th><th>Made</th><th>Rate</th></tr></thead><tbody>${state.seats.map((s,i)=>`<tr><td><span class="dot x${s.side}"></span>${PN(i)}</td><td>${pBids[i]}</td><td>${pMade[i]}</td><td>${pct(pMade[i],pBids[i])}</td></tr>`).join("")}</tbody></table></div>` : "";
  return `<div class="panel"><h2>Stats</h2><div class="hl">${cards.join("")}</div>${table}${ptable}
    ${favSuit?`<p class="hint">Favorite trump: ${suitHtml(favSuit[0])}, ${plural(favSuit[1],"hand")}.</p>`:""}</div>`;
}

function guideView(){
  const R = state.phase === "play" ? state.rules : state.setup;
  return `<div class="panel guide">
    <section><h2>The idea</h2><p>Pitch is a fast trick-taking game, usually played with partners. Each hand, someone bids how many points their team will win. Then they <b>pitch</b> the first card, which sets trump. There are only four points up for grabs in a normal hand, so every trick matters.</p></section>
    <section><h3>What you need</h3><ul><li>One standard 52-card deck. Aces are high.</li><li>4 players in two teams of 2, partners sitting across. Or 3 to 4 players cutthroat, everyone for themselves.</li></ul></section>
    <section><h3>1. The deal</h3><p>The dealer deals 6 cards to each player, 3 at a time. The deal passes left each hand.</p></section>
    <section><h3>2. Bidding</h3>
      <ol><li>Starting left of the dealer, each player gets <b>one chance</b> to bid or pass. Bids go from 2 up to ${maxPoints(R)}, and each bid has to beat the last.</li>
      <li>The dealer bids last and can take the bid by matching or beating the high bid, depending on house rules.</li>
      <li>${R.stuck?"If everyone passes, the dealer is <b>stuck</b> and must bid 2.":"If everyone passes, throw the hand in and deal again."}</li>
      <li>The winning bidder is the <b>pitcher</b>.</li></ol></section>
    <section><h3>3. The pitch</h3><p>The pitcher leads the first card. <b>Its suit becomes trump.</b> No announcing, just play it.</p></section>
    <section><h3>4. Playing tricks</h3>
      <ul><li>Everyone plays one card, going left.</li>
      <li>If you can follow the suit that was led, you must, <b>or you may play trump instead</b>. You can always trump. If you can't follow suit, play anything.</li>
      <li>The highest trump wins the trick. If no trump was played, the highest card of the suit led wins.</li>
      <li>The winner leads the next trick. Play all 6 tricks.</li></ul></section>
    <section><h3>5. The points</h3>
      <dl class="rtable">
        <dt><b>High:</b> the highest trump played. It goes to whoever played it.</dt><dd>1</dd>
        <dt><b>Low:</b> the lowest trump played. ${R.lowRule==="dealt"?"It goes to whoever was dealt it.":"It goes to whoever wins the trick it's in."}</dt><dd>1</dd>
        <dt><b>Jack:</b> the Jack of trump, if it was dealt. It goes to whoever wins the trick it's in.</dt><dd>1</dd>
        ${R.offjack?`<dt><b>Off-Jack:</b> the other Jack of the same color. It counts as a trump, ranked just below the Jack.</dt><dd>1</dd>`:""}
        ${R.jokers?`<dt><b>Jokers:</b> both jokers are trump, ranked below the Jacks. Each is 1 point to whoever takes it.</dt><dd>1 each</dd>`:""}
        ${R.three?`<dt><b>Three:</b> the 3 of trump, to whoever takes it.</dt><dd>3</dd>`:""}
        <dt><b>Game:</b> after the hand, each side counts card points in the tricks they won: 10 = 10, Ace = 4, King = 3, Queen = 2, Jack = 1. Most points takes Game. A tie means nobody gets it.</dt><dd>1</dd>
      </dl></section>
    <section><h3>6. Scoring</h3>
      <ul><li>If the bidding team wins at least as many points as they bid, they score everything they took.</li>
      <li>If not, they're <b>set</b>. They lose the amount they bid, and can go negative (“in the hole”).</li>
      <li>The other side always keeps whatever points they took.</li>
      ${R.smudge?`<li><b>Smudge:</b> bid ${maxPoints(R)} and take every point, and you win the game on the spot.</li>`:""}</ul>
      <div class="example"><span><b>Example:</b> Us bid 3 in hearts.</span><span>Us take High, Jack and Game (3 points). Them take Low (1). Us made it: Us +3, Them +1.</span><span>If Us only took High and Game, that's 2 on a bid of 3: Us −3, Them keep their points.</span></div></section>
    <section><h3>7. Winning</h3><p>First to ${R.target} wins. ${R.bidderOut?"If both sides pass it on the same hand, the <b>bidder goes out</b> as long as they made their bid.":"If both sides pass it on the same hand, count the points in order (High, Low, Jack, then Game), and whoever reaches the target first wins."} The app handles this automatically.</p></section>
    <section><h3>Strategy tips</h3>
      <ul><li>A hand with the Ace of a suit is usually good for at least High, so bidding 2 is fairly safe.</li>
      <li>The Jack is the most fought-over card. If your partner bid, try to win the trick your Jack lands in.</li>
      <li>Hold your 10s: they're worth the most toward Game.</li>
      <li>Bidding last is an advantage. You know what everyone else did.</li>
      <li>When the other team is close to winning, bid aggressively. Only the bidder can go out on a tie.</li></ul></section>
    <section><h3>Glossary</h3>
      <ul><li><b>Pitcher:</b> the player who won the bid and leads the first card.</li><li><b>Set:</b> failing to make your bid.</li><li><b>In the hole:</b> a negative score.</li><li><b>Stuck:</b> the dealer forced to bid when everyone passes.</li><li><b>Smudge:</b> taking every point on a max bid.</li></ul></section>
  </div>`;
}

// ---------- events ----------
function openEntry(mode, idx){
  const ptsBlank = {};
  if (mode === "edit"){ const h = state.hands[idx]; entry = { mode, editing:idx, bidder:h.bidder, bid:h.bid, suit:h.suit, pts:{...h.pts}, gc:[...(h.gc||[])], error:"" }; }
  else if (mode === "points"){ const pd = state.pending; entry = { mode, editing:null, bidder:pd.bidder, bid:pd.bid, suit:pd.suit, pts:ptsBlank, gc:[], error:"" }; }
  else { const pd = state.pending; entry = { mode:"bid", editing:null, bidder:pd?pd.bidder:null, bid:pd?pd.bid:null, suit:pd?pd.suit:null, pts:ptsBlank, gc:[], error:"" }; }
  render(); document.getElementById("cancel")?.scrollIntoView({block:"start", behavior:"smooth"});
}
function autoGame(){
  const vals = state.sides.map((_,i)=> /^\d+$/.test(String(entry.gc[i]??"").trim()) ? +entry.gc[i] : null);
  if (vals.some(v=>v==null)) return;
  const m = Math.max(...vals), w = vals.map((v,i)=>i).filter(i=>vals[i]===m);
  entry.pts.game = w.length === 1 ? w[0] : -1;
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, su = state.setup;
  switch(act){
    case "tab": state.tab = b.dataset.v; save(); render(); window.scrollTo(0,0); break;
    case "mode": su.mode = b.dataset.v; su.firstDealer = 0; save(); render(); break;
    case "target": su.target = +b.dataset.v; save(); render(); break;
    case "low": su.lowRule = b.dataset.v; save(); render(); break;
    case "rule": su[b.dataset.k] = !su[b.dataset.k]; save(); render(); break;
    case "begin": {
      const { sides, seats } = buildSeats(su);
      state.sides = sides; state.seats = seats;
      state.rules = { target:su.target, lowRule:su.lowRule, stuck:su.stuck, bidderOut:su.bidderOut, smudge:su.smudge, offjack:su.offjack, jokers:su.jokers, three:su.three, drink:su.drink, dealer0:su.firstDealer };
      state.hands = []; state.pending = null; state.match = { results:[] }; state.phase = "play"; entry = null;
      save(); render(); keepAwake(); window.scrollTo(0,0); break;
    }
    case "newHand": case "changeBid": openEntry("bid"); break;
    case "enterPoints": openEntry("points"); break;
    case "edit": openEntry("edit", +b.dataset.i); break;
    case "cancel": entry = null; render(); break;
    case "bidder": entry.bidder = +b.dataset.i; entry.error = ""; render(); break;
    case "bid": entry.bid = +b.dataset.v; entry.error = ""; render(); break;
    case "suit": entry.suit = entry.suit === b.dataset.v ? null : b.dataset.v; render(); break;
    case "pt": entry.pts[b.dataset.k] = +b.dataset.v; if (b.dataset.k === "game") entry.gc = []; entry.error = ""; render(); break;
    case "saveEntry": {
      if (entry.mode !== "points"){
        if (entry.bidder == null){ entry.error = "Tap who won the bid."; render(); break; }
        if (entry.bid == null){ entry.error = "Tap the bid amount."; render(); break; }
      }
      if (entry.mode === "bid"){ state.pending = { bidder:entry.bidder, bid:entry.bid, suit:entry.suit }; entry = null; save(); render(); break; }
      const miss = activeItems().find(it => entry.pts[it.k] == null);
      if (miss){ entry.error = `Tap who took ${miss.name}${miss.none?`, or “${miss.none}”`:""}.`; render(); break; }
      const h = { bidder:entry.bidder, bid:entry.bid, suit:entry.suit, pts:{...entry.pts}, gc:entry.gc.slice() };
      if (entry.mode === "edit") state.hands[entry.editing] = h; else { state.hands.push(h); state.pending = null; }
      entry = null; save(); render(); window.scrollTo({top:0, behavior:"smooth"}); break;
    }
    case "delHand": confirmThen("del", ()=>{ state.hands.splice(entry.editing,1); entry = null; save(); render(); }); break;
    case "undo": confirmThen("undo", ()=>{ state.hands.pop(); state.pending = null; entry = null; save(); render(); }); break;
    case "rematch": { const { win } = runGame(); if (win != null) state.match.results.push(win); state.rules.dealer0 = (dealerOf(state.hands.length)) % state.seats.length; state.hands = []; state.pending = null; entry = null; save(); render(); window.scrollTo(0,0); break; }
    case "newsetup": state.phase = "setup"; state.hands = []; state.pending = null; save(); render(); break;
    case "newgame": confirmThen("new", ()=>{ state.phase = "setup"; state.hands = []; state.pending = null; entry = null; save(); render(); }); break;
  }
});
document.addEventListener("input", e => {

// History adapter: how a Pitch game looks to the shared history module.
// One side per team (partners) or per player (cutthroat), one scorecard row per hand. Each game of a
// match is its own record: "Next game" clears the hands, which closes this game's record.
const HX = {
  app: "pitch", title: "Pitch", unit: ["hand", "hands"], sideWord: "team", lowWins: false,
  guest: n => /^((player|partner) \d+|us|them)$/i.test(String(n).trim()),
  current(){
    if (state.phase !== "play" || !state.hands.length) return null;
    const S = state.sides, H = state.hands, { win, how } = runGame(), sc = H.map(h => scoreHand(h));
    const prev = (state.match && state.match.results) || [];
    // who bid: the player, or their team when the player has no name
    const by = h => { const p = state.seats[h.bidder]; return HX.guest(p.name) ? S[p.side].name : p.name; };
    const bids = S.map(() => 0), made = S.map(() => 0), big = { bid: 0, who: [] };
    H.forEach((h,k) => {
      const s = sc[k]; bids[s.bs]++;
      if (!s.made) return;
      made[s.bs]++;
      if (h.bid > big.bid){ big.bid = h.bid; big.who = [by(h)]; } else if (h.bid === big.bid && !big.who.includes(by(h))) big.who.push(by(h));
    });
    const suit = k => { const x = SUITS.find(q => q.k === k); return x ? " " + x.s : ""; };
    const howTxt = { bidder: "bidder went out", countout: "counted out", smudge: "smudge" }[how] || "";
    return {
      sides: S.map((s,i) => ({ name: s.name, players: state.seats.filter(p => p.side === i).map(p => p.name) })),
      rounds: sc.map(s => s.pts),
      done: win != null, winners: win != null ? [win] : undefined,
      labels: H.map((h,k) => `${k+1} · ${by(h)} bid ${h.bid}${suit(h.suit)}`),
      note: [`to ${state.rules.target}`, howTxt, prev.length ? `match game ${prev.length + 1}` : ""].filter(Boolean).join(" · "),
      extra: { how, match: prev.slice(), bids, made, big, raw: { seats: state.seats, rules: state.rules, hands: H } }
    };
  },
  detail(g){
    const x = g.extra; if (!x || !Array.isArray(x.bids)) return "";
    const nm = i => { const s = g.sides[i]; return esc(s.players.length > 1 && HX.guest(s.name) && s.players.some(p => !HX.guest(p)) ? s.players.join(" & ") : s.name); };
    const bids = g.sides.map((_,i) => `${nm(i)} ${x.made[i] || 0} of ${x.bids[i] || 0}`).join(" · ");
    const m = Array.isArray(x.match) && x.match.length ? g.sides.map((_,i) => `${nm(i)} ${x.match.filter(w => w === i).length}`).join(" · ") : "";
    return `<p class="hint">Bids made: ${bids}</p>${m ? `<p class="hint">Game ${x.match.length + 1} of a match. Games won before it: ${m}</p>` : ""}`;
  },
  records(done){
    const rows = done.filter(g => g.extra && g.extra.big && g.extra.big.bid > 0);
    if (!rows.length) return [];
    const m = Math.max(...rows.map(g => g.extra.big.bid)), top = rows.filter(g => g.extra.big.bid === m);
    const names = [...new Set(top.flatMap(g => g.extra.big.who))].slice(0,3).join(", ");
    const when = top.length === 1 ? new Date(top[0].date).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" }) : `${top.length} games`;
    return [["Highest bid made", names, `Bid ${m} · ${when}`]];
  }
};
/* ---------- game history (shared module, same in every score app) ----------
   Every game with at least one scored round is saved to localStorage as it's played, with its date,
   the teams or players, every round's scores, the final totals and the winner. A "History" screen shows
   all-time records by player name, a game log with full scorecards, and backup / restore.
   The app supplies an adapter, HX (defined just above), and this module wraps the app's save() and render(). */
const hx = (() => {
  const HKEY = HX.app + "-history-v1", BKEY = HX.app + "-last-backup";
  const unitOne = (HX.unit || ["round", "rounds"])[0], unitMany = (HX.unit || ["round", "rounds"])[1];
  const ui = { open: false, range: "all", sel: null, game: null, all: false, msg: "", confirm: null, timer: 0 };
  const e = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = n => (n < 0 ? "−" : "") + Math.abs(n).toLocaleString("en-US");
  const plural = (n, w, ws) => `${n} ${n === 1 ? w : (ws || w + "s")}`;
  const pkey = n => String(n || "").trim().replace(/\s+/g, " ").toLowerCase();
  const guest = n => !pkey(n) || (HX.guest ? HX.guest(n) : /^(player|partner|team|side|seat) \d+$/i.test(String(n).trim()));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const whenTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) + " · " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }); };
  const dayTxt = iso => { const d = new Date(iso); return isNaN(d) ? "Unknown date" : d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };

  // ----- storage -----
  const valid = g => !!g && typeof g.id === "string" && Array.isArray(g.sides) && g.sides.length >= 1 && g.sides.every(s => s && typeof s.name === "string" && Array.isArray(s.players))
    && Array.isArray(g.rounds) && g.rounds.every(r => Array.isArray(r) && r.length === g.sides.length && r.every(v => typeof v === "number" && isFinite(v)));
  function load() { try { const a = JSON.parse(localStorage.getItem(HKEY) || "[]"); return Array.isArray(a) ? a.filter(valid) : []; } catch (err) { return []; } }
  let games = load();
  function persist() { try { localStorage.setItem(HKEY, JSON.stringify(games)); } catch (err) { /* storage full or blocked */ } }
  const totalsOf = g => Array.isArray(g.totals) && g.totals.length === g.sides.length ? g.totals : g.sides.map((_, i) => g.rounds.reduce((s, r) => s + r[i], 0));
  function winnersOf(g) {
    if (Array.isArray(g.winners) && g.winners.length) return g.winners;
    const t = totalsOf(g), best = g.lowWins ? Math.min(...t) : Math.max(...t);
    return t.map((_, i) => i).filter(i => t[i] === best);
  }
  const isDone = g => !!g.done;

  // ----- keep the archive in step with the current game -----
  // A game is saved as soon as its first round is scored. Starting a new game (or undoing back to nothing)
  // detaches it; a game undone to nothing after one round is dropped, anything longer stays as unfinished.
  function sync() {
    if (typeof state !== "object" || !state) return;
    let cur = null;
    try { cur = HX.current(); } catch (err) { cur = null; }
    const has = cur && Array.isArray(cur.rounds) && cur.rounds.length > 0;
    const k = state.hxId ? games.findIndex(g => g.id === state.hxId) : -1;
    if (has) {
      if (!state.hxId) state.hxId = newId();
      const prev = k >= 0 ? games[k] : null;
      const g = {
        id: state.hxId, date: prev ? prev.date : new Date().toISOString(), updated: new Date().toISOString(),
        sides: cur.sides.map(s => ({ name: String(s.name || ""), players: (s.players || []).map(String) })),
        rounds: cur.rounds.map(r => r.map(v => +v || 0)),
        totals: (cur.totals || null) && cur.totals.map(v => +v || 0),
        done: !!cur.done, winners: cur.done && Array.isArray(cur.winners) ? cur.winners.slice() : undefined,
        lowWins: !!(cur.lowWins != null ? cur.lowWins : HX.lowWins), note: cur.note || "", labels: cur.labels || undefined, extra: cur.extra || undefined
      };
      if (!g.totals) delete g.totals;
      const before = prev ? JSON.stringify(Object.assign({}, prev, { updated: 0 })) : "";
      if (before === JSON.stringify(Object.assign({}, g, { updated: 0 }))) return;
      if (k >= 0) games[k] = g; else games.push(g);
      persist();
    } else if (state.hxId) {
      // games with no game-over of their own end when the app says so (New game): the best total wins
      let ended = false;
      try { ended = typeof HX.ended === "function" && !!HX.ended(); } catch (err) { ended = false; }
      if (k >= 0 && !games[k].done && ended) {
        const g = games[k], t = g.totals || g.sides.map((_, i) => g.rounds.reduce((a, r) => a + (+r[i] || 0), 0));
        const best = g.lowWins ? Math.min(...t) : Math.max(...t);
        g.done = true; g.winners = t.map((_, i) => i).filter(i => t[i] === best); g.updated = new Date().toISOString();
        persist();
      } else if (k >= 0 && !games[k].done && games[k].rounds.length <= 1) { games.splice(k, 1); persist(); }
      state.hxId = null;
    }
  }

  // ----- stats -----
  const byDate = () => games.slice().sort((a, b) => String(a.date).localeCompare(String(b.date)));
  function inRange(g) {
    if (ui.range === "all") return true;
    const d = new Date(g.date);
    if (isNaN(d)) return false;
    if (ui.range[0] === "y") return d.getFullYear() === +ui.range.slice(1);
    return Date.now() - d <= +ui.range.slice(1) * 864e5;
  }
  const rangeLabel = () => ui.range === "all" ? "all time" : ui.range[0] === "y" ? ui.range.slice(1) : `the last ${ui.range.slice(1)} days`;
  function sideLabel(s) {
    const named = s.players.filter(p => !guest(p));
    if (s.players.length > 1) return guest(s.name) || !s.name ? (named.length ? s.players.join(" & ") : s.name || "Team") : `${s.name} (${s.players.join(" & ")})`;
    return s.players[0] || s.name;
  }
  function shortLabel(s) {
    if (s.players.length > 1) return guest(s.name) || !s.name ? s.players.join(" & ") : s.name;
    return s.players[0] || s.name;
  }
  function career(list) {
    const map = new Map(), pairs = new Map();
    list.filter(isDone).forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => {
        const won = w.includes(i);
        s.players.forEach(name => {
          if (guest(name)) return;
          const k = pkey(name);
          let p = map.get(k);
          if (!p) { p = { k, name: "", gp: 0, wins: 0, shared: 0, sum: 0, best: null, worst: null, streak: 0, bestStreak: 0 }; map.set(k, p); }
          p.name = String(name).trim();
          p.gp++; p.sum += t[i];
          const better = (a, b) => g.lowWins ? a < b : a > b;
          if (p.best == null || better(t[i], p.best)) p.best = t[i];
          if (p.worst == null || better(p.worst, t[i])) p.worst = t[i];
          if (won) { p.wins++; if (w.length > 1) p.shared++; p.streak++; p.bestStreak = Math.max(p.bestStreak, p.streak); } else p.streak = 0;
        });
        const named = s.players.filter(n => !guest(n));
        if (s.players.length === 2 && named.length === 2) {
          const pk = named.map(pkey).sort().join("|");
          const r = pairs.get(pk) || { names: named.map(n => String(n).trim()).sort((a, b) => a.localeCompare(b)), gp: 0, wins: 0 };
          r.gp++; if (won) r.wins++;
          pairs.set(pk, r);
        }
      });
    });
    const players = [...map.values()].sort((a, b) => b.wins - a.wins || b.wins / b.gp - a.wins / a.gp || a.name.localeCompare(b.name));
    const teams = [...pairs.values()].sort((a, b) => b.wins - a.wins || b.gp - a.gp || a.names.join().localeCompare(b.names.join()));
    return { players, teams };
  }
  const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
  const avg = (a, b) => b ? num(Math.round(a / b)) : "–";

  // ----- views -----
  function button() { return `<button class="small ghost" data-hx="open" id="hx-open" type="button">History</button>`; }
  function note() { return `<p class="hint">Saved in History with today's date.</p>`; }
  function unbacked() { let at = 0; try { at = +localStorage.getItem(BKEY) || 0; } catch (err) { /* ignore */ } return games.filter(isDone).length - at; }
  function award(t, w, d) { return `<div class="hx-award"><span class="hx-an">${t}</span><span class="hx-aw">${w}</span><span class="hx-ad">${d}</span></div>`; }

  function recordsView(done, stats) {
    if (!done.length) return "";
    const items = [];
    const scores = [], margins = [];
    done.forEach(g => {
      const t = totalsOf(g), w = winnersOf(g);
      g.sides.forEach((s, i) => scores.push({ v: t[i], who: sideLabel(s), g }));
      if (w.length === 1 && g.sides.length > 1) {
        const others = t.filter((_, i) => i !== w[0]);
        const runner = g.lowWins ? Math.min(...others) : Math.max(...others);
        margins.push({ v: Math.abs(t[w[0]] - runner), who: sideLabel(g.sides[w[0]]), g });
      }
    });
    const pick = (list, hi) => { const m = hi ? Math.max(...list.map(x => x.v)) : Math.min(...list.map(x => x.v)); return { m, who: list.filter(x => x.v === m) }; };
    const names = who => e([...new Set(who.map(x => x.who))].slice(0, 3).join(", ")) + (new Set(who.map(x => x.who)).size > 3 ? "…" : "");
    const when = who => who.length === 1 ? dayTxt(who[0].g.date) : `${who.length} times`;
    const lowWins = done.every(g => g.lowWins);
    const best = pick(scores, !lowWins), worst = pick(scores, lowWins);
    items.push(award(lowWins ? "Lowest score" : "Highest score", names(best.who), `${num(best.m)} · ${when(best.who)}`));
    items.push(award(lowWins ? "Highest score" : "Lowest score", names(worst.who), `${num(worst.m)} · ${when(worst.who)}`));
    if (margins.length) { const mg = pick(margins, true); items.push(award("Biggest win", names(mg.who), `By ${num(mg.m)} · ${when(mg.who)}`)); }
    const most = f => stats.players.length ? Math.max(...stats.players.map(p => p[f])) : 0;
    const whoOf = (m, f) => e(stats.players.filter(p => p[f] === m).map(p => p.name).slice(0, 3).join(", "));
    const mw = most("wins"), ms = most("bestStreak"), mg2 = most("gp");
    if (stats.players.length) {
      items.push(award("Most wins", mw ? whoOf(mw, "wins") : "–", plural(mw, "win")));
      items.push(award("Longest win streak", ms ? whoOf(ms, "bestStreak") : "–", `${ms} in a row`));
      items.push(award("Most games", whoOf(mg2, "gp"), plural(mg2, "game")));
    }
    if (HX.records) { try { (HX.records(done) || []).forEach(r => items.push(award(e(r[0]), e(r[1]), e(r[2])))); } catch (err) { /* adapter records are optional */ } }
    return `<div class="panel"><h2>Records</h2><div class="hx-awards">${items.join("")}</div></div>`;
  }

  function scorecard(g) {
    const t = totalsOf(g), w = winnersOf(g), run = g.sides.map(() => 0);
    const head = `<tr><th>${e(unitOne[0].toUpperCase() + unitOne.slice(1))}</th>${g.sides.map((s, i) => `<th class="${g.done && w.includes(i) ? "hx-won" : ""}">${e(shortLabel(s))}</th>`).join("")}</tr>`;
    const body = g.rounds.map((r, ri) => {
      r.forEach((v, i) => { run[i] += v; });
      const label = g.labels && g.labels[ri] ? g.labels[ri] : String(ri + 1);
      return `<tr><td>${e(label)}</td>${r.map((v, i) => `<td>${num(v)}${g.rounds.length > 1 ? `<span class="hx-run">${num(run[i])}</span>` : ""}</td>`).join("")}</tr>`;
    }).join("");
    const foot = `<tr class="hx-tot"><td>Total</td>${t.map((v, i) => `<td class="${g.done && w.includes(i) ? "hx-won" : ""}">${num(v)}</td>`).join("")}</tr>`;
    let more = "";
    if (HX.detail) { try { more = HX.detail(g) || ""; } catch (err) { more = ""; } }
    return `<div class="hx-card"><div class="stwrap hx-wrap"><table class="st hx-sc"><thead>${head}</thead><tbody>${body}${foot}</tbody></table></div>${g.rounds.length > 1 ? `<p class="hint">Small numbers are running totals.</p>` : ""}${more}</div>`;
  }

  function logView(list, sel) {
    let rows = list.slice().reverse();
    if (sel) rows = rows.filter(g => g.sides.some(s => s.players.some(n => pkey(n) === sel.k)));
